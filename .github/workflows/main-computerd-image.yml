# Build computerd images from commits that passed CI. The mutable :main tag
# follows main, while :next follows the changesets Version Packages branch.

name: Computerd branch image

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main, release]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  # Keep the main and next publishers independent while allowing newer commits
  # on either branch to cancel stale image builds for the same tag.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: >-
      ${{
        github.repository == 'cloudflare/computer' &&
        (
          (
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            (
              github.event.workflow_run.event == 'push' ||
              github.event.workflow_run.event == 'workflow_dispatch'
            ) &&
            (
              github.event.workflow_run.head_branch == 'main' ||
              github.event.workflow_run.head_branch == 'release'
            ) &&
            github.event.workflow_run.head_repository.full_name == github.repository
          ) ||
          (
            github.event_name == 'workflow_dispatch' &&
            (
              github.ref == 'refs/heads/main' ||
              github.ref == 'refs/heads/release'
            )
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_run checks out the default branch by default. Build the
          # exact commit whose CI run succeeded instead.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 1

      - name: Select the mutable image tag
        id: image
        env:
          SOURCE_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          case "$SOURCE_BRANCH" in
            main)
              tag=main
              ;;
            release)
              tag=next
              ;;
            *)
              echo "Unsupported source branch: $SOURCE_BRANCH" >&2
              exit 1
              ;;
          esac
          echo "branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/install

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2t64 fuse3

      # build-bin generates the SEA blob with the active Node executable and
      # injects it into the pinned Node 22.22.3 target binary.
      - name: Use the target Node version for the binary build
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3

      # computerd's binary build bundles the sibling packages, so their dist/
      # directories must exist before build:bin runs.
      - name: Build all workspaces
        run: npm run build --workspaces --if-present

      - name: Build the computerd binary
        run: npm run build:bin --workspace @cloudflare/computerd

      - name: Stage the computerd binary
        run: |
          mkdir -p packages/computer-computerd-linux-x64/bin
          cp artifacts/computerd/computerd-linux-x64 \
            packages/computer-computerd-linux-x64/bin/computerd
          chmod 755 packages/computer-computerd-linux-x64/bin/computerd

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A slower CI run for an older commit can finish after a newer one. Do
      # not let that run replace the newer branch image.
      - name: Verify the source branch has not advanced
        id: branch-sha
        env:
          SOURCE_BRANCH: ${{ steps.image.outputs.branch }}
        run: |
          git fetch --no-tags --depth=1 origin "$SOURCE_BRANCH"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "$SOURCE_BRANCH advanced while this image was building; skipping the push"
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push the branch image
        if: steps.branch-sha.outputs.current == 'true'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --provenance=false \
            --tag "ghcr.io/cloudflare/computer-computerd-linux-x64:$IMAGE_TAG" \
            --file packages/computer-computerd-linux-x64/Dockerfile \
            packages/computer-computerd-linux-x64
